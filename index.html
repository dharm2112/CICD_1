<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Environment | CI/CD Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #12332b; background: linear-gradient(135deg, #dcfce7, #f0fdf4); }
    main { max-width: 680px; padding: 48px; background: white; border: 1px solid #bbf7d0; border-radius: 24px; box-shadow: 0 20px 55px #04785718; }
    .tag { display: inline-block; padding: 8px 12px; color: #047857; background: #d1fae5; border-radius: 999px; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    h1 { margin: 24px 0 12px; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; }
    h1 span { color: #059669; }
    p { color: #527166; line-height: 1.7; }
    .status { margin-top: 24px; padding: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; font-size: 14px; }
    button { margin-top: 20px; border: 0; border-radius: 10px; padding: 12px 18px; color: white; background: #059669; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <span class="tag">DEMO · TEST ENVIRONMENT</span>
    <h1>Welcome to <span>Demo</span></h1>
    <p>This is the demo branch version. Experiment with changes here before promoting the approved version to main.</p>
    <div class="status"><strong>Branch:</strong> demo<br><strong>Release:</strong> v0.2.0-demo<br><strong>Environment:</strong> Testing</div>
    <button onclick="document.getElementById('result').textContent='Demo branch button works!'">Run demo test</button>
    <p id="result" aria-live="polite"></p>
  </main>
</body>
</html>
