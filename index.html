<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production | CI/CD Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #172033; background: linear-gradient(135deg, #eef2ff, #f8fafc); }
    main { max-width: 680px; padding: 48px; background: white; border: 1px solid #e5e7eb; border-radius: 24px; box-shadow: 0 20px 55px #3730a315; }
    .tag { display: inline-block; padding: 8px 12px; color: #4338ca; background: #eef2ff; border-radius: 999px; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    h1 { margin: 24px 0 12px; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; }
    h1 span { color: #4f46e5; }
    p { color: #64748b; line-height: 1.7; }
    .status { margin-top: 24px; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
    button { margin-top: 20px; border: 0; border-radius: 10px; padding: 12px 18px; color: white; background: #4f46e5; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <span class="tag">MAIN · PRODUCTION</span>
    <h1>Welcome to <span>Production</span></h1>
    <p>This is the main branch version of the website. Change this text, push to GitHub, and verify that your CI/CD pipeline deploys the update.</p>
    <div class="status"><strong>Branch:</strong> main<br><strong>Release:</strong> v1.0.0<br><strong>Environment:</strong> Production</div>
    <button onclick="document.getElementById('result').textContent='Main branch button works!'">Test button</button>
    <p id="result" aria-live="polite"></p>
  </main>
</body>
</html>
